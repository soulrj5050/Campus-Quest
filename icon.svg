<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Compass ring -->
  <circle cx="256" cy="220" r="110" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.8"/>
  <!-- North needle -->
  <polygon points="256,128 272,210 256,195 240,210" fill="#ff6b35"/>
  <!-- South needle -->
  <polygon points="256,312 240,230 256,245 272,230" fill="#00d4ff"/>
  <!-- Center dot -->
  <circle cx="256" cy="220" r="12" fill="#ffd700"/>
  <!-- Cardinal letters -->
  <text x="256" y="118" text-anchor="middle" font-size="28" font-family="Arial,sans-serif" font-weight="bold" fill="#ff6b35">N</text>
  <text x="256" y="348" text-anchor="middle" font-size="28" font-family="Arial,sans-serif" font-weight="bold" fill="#00d4ff">S</text>
  <text x="136" y="228" text-anchor="middle" font-size="28" font-family="Arial,sans-serif" font-weight="bold" fill="#8892b0">W</text>
  <text x="376" y="228" text-anchor="middle" font-size="28" font-family="Arial,sans-serif" font-weight="bold" fill="#8892b0">E</text>
  <!-- Title -->
  <text x="256" y="430" text-anchor="middle" font-size="64" font-family="Arial,sans-serif" font-weight="bold" fill="#ffffff" letter-spacing="8">QUEST</text>
  <!-- Subtitle sparkle -->
  <text x="256" y="470" text-anchor="middle" font-size="24" font-family="Arial,sans-serif" fill="#ffd700">✦ ✦ ✦</text>
</svg>
